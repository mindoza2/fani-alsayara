<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070b12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>فني السيارة — فحص وتشخيص ذكي</title>
<link rel="manifest" href="car-tech/manifest.webmanifest">
<link rel="icon" href="car-tech/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="car-tech/app.css">
</head>
<body>
<div id="app" class="app">
  <aside class="sidebar glass" id="sidebar">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 40 40"><defs><linearGradient id="bm" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3de0ff"/><stop offset="1" stop-color="#2f7bff"/></linearGradient></defs><circle cx="20" cy="20" r="17" fill="none" stroke="url(#bm)" stroke-width="3" stroke-dasharray="80 27" transform="rotate(130 20 20)"/><path d="M20 20 L29 12" stroke="#3de0ff" stroke-width="3" stroke-linecap="round"/><circle cx="20" cy="20" r="3.5" fill="#3de0ff"/></svg>
      </div>
      <div>
        <div class="brand-name">فني السيارة</div>
        <div class="brand-sub">فحص وتشخيص ذكي</div>
      </div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="sidebar-foot" id="sidebarFoot"></div>
  </aside>

  <div class="main">
    <header class="topbar glass" id="topbar">
      <button class="icon-btn only-mobile" id="menuBtn" aria-label="القائمة">☰</button>
      <div class="page-title" id="pageTitle">لوحة القيادة</div>
      <div class="top-status">
        <span class="demo-flag hidden" id="demoFlag">وضع تجريبي · بيانات نموذجية</span>
        <span class="stat-chip" id="voltChip" title="فولت البطارية من القطعة"><span class="dot"></span><span class="num" id="voltVal">--.-</span><small>V</small></span>
        <button class="conn-chip" id="connChip"><span class="dot"></span><span id="connText">غير متصل</span></button>
        <button class="icon-btn hidden" id="voiceBtn" aria-label="أمر صوتي" title="أمر صوتي بالعربي">🎙</button>
      </div>
    </header>
    <div class="busy-bar hidden" id="busyBar" role="status" aria-live="polite"><i></i><span></span></div>
    <main class="content" id="content" tabindex="-1"></main>
  </div>

  <nav class="bottombar glass" id="bottombar"></nav>
</div>

<div class="sheet-backdrop hidden" id="sheetBackdrop"></div>
<div class="sheet glass hidden" id="moreSheet"></div>
<div class="modal-backdrop hidden" id="modalBackdrop"><div class="modal" id="modal"></div></div>
<div class="toasts" id="toasts"></div>
<noscript><div style="padding:2rem;color:#fff">هذا البرنامج يحتاج تفعيل JavaScript في المتصفح.</div></noscript>
<script type="module" src="car-tech/js/app.js"></script>
</body>
</html>
